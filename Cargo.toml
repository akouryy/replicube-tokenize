[package]
name = "replicube-tokenize"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A CLI and Rust crate for tokenizing Replicube Lua code, with size reporting"
license = "MIT"

[lib]
name = "replicube_tokenize"
path = "src/lib.rs"

[[bin]]
name = "replicube-tokenize"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }

[workspace]
